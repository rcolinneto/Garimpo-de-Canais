services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-garimpo}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-garimpo}
      POSTGRES_DB: ${POSTGRES_DB:-garimpo}
    volumes:
      - db_data:/var/lib/postgresql/data
    ports:
      - "${POSTGRES_HOST_PORT:-5433}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-garimpo}"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build: .
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-garimpo}:${POSTGRES_PASSWORD:-garimpo}@db:5432/${POSTGRES_DB:-garimpo}
      YOUTUBE_API_KEY: ${YOUTUBE_API_KEY:-}
      DASHBOARD_PASSWORD: ${DASHBOARD_PASSWORD:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      ALERT_EMAIL_FROM: ${ALERT_EMAIL_FROM:-}
      ALERT_EMAIL_TO: ${ALERT_EMAIL_TO:-}
    ports:
      - "${APP_HOST_PORT:-8010}:8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  db_data:
