services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-garimpo}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-garimpo}
      POSTGRES_DB: ${POSTGRES_DB:-garimpo}
    volumes:
      - db_data:/var/lib/postgresql/data
    ports:
      - "${POSTGRES_HOST_PORT:-5433}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-garimpo}"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build: .
    restart: unless-stopped
    # env_file carrega TODAS as variáveis documentadas em .env.example (cron,
    # pesos do score, filtros de descoberta etc.) — sem isso, só as poucas
    # listadas explicitamente chegavam ao container, e o resto ficava mudo
    # mesmo que alguém editasse o .env.
    env_file:
      - .env
    environment:
      # Sobrescreve o que vem do .env: dentro da rede do compose o banco é
      # "db", não "localhost".
      DATABASE_URL: postgresql://${POSTGRES_USER:-garimpo}:${POSTGRES_PASSWORD:-garimpo}@db:5432/${POSTGRES_DB:-garimpo}
    ports:
      - "${APP_HOST_PORT:-8010}:8000"
    depends_on:
      db:
        condition: service_healthy

  dashboard:
    build: .
    restart: unless-stopped
    command:
      - streamlit
      - run
      - src/dashboard/app.py
      - --server.port=8501
      - --server.address=0.0.0.0
    env_file:
      - .env
    environment:
      # Consome a API pela rede interna do compose, nunca o banco direto.
      API_BASE_URL: http://app:8000
    ports:
      - "${DASHBOARD_HOST_PORT:-8501}:8501"
    depends_on:
      - app

volumes:
  db_data:
