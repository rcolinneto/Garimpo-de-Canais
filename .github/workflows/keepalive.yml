name: Manter os serviços acordados em horário comercial (Render free tier)

# O Render free tier desliga um serviço depois de 15 min sem tráfego. Quando
# alguém usa o sistema logo depois disso, a primeira chamada espera dezenas de
# segundos enquanto o contêiner sobe (ou cai num 502 do proxy).
#
# Este ping a cada 10 minutos — bem abaixo do limiar de 15 min — mantém os dois
# serviços de pé durante o horário de trabalho, que é quando alguém de fato
# abre o dashboard. Fora dessa janela eles dormem, e a espera é absorvida pelo
# próprio dashboard, que tenta de novo até a API acordar em vez de mostrar erro
# (ver ESPERA_MAXIMA_API_ACORDAR_SEGUNDOS em src/dashboard/api_client.py).
#
# POR QUE NÃO 24/7: o Render dá 750 horas grátis por WORKSPACE (não por
# serviço), compartilhadas entre todos os serviços. Manter os dois sempre
# acordados custaria ~1.460h/mês e, ao estourar as 750h, o Render SUSPENDE
# todos os serviços gratuitos até o mês virar. Do jeito abaixo:
#   2 serviços x ~10h/dia x ~22 dias úteis = ~440h/mês, com folga confortável.
#
# Requer os secrets RENDER_DASHBOARD_URL e RENDER_API_URL (Settings > Secrets
# and variables > Actions).
#
# LIMITAÇÃO IMPORTANTE, MEDIDA NA PRÁTICA: o GitHub não honra o "*/10" em
# repositório gratuito. Olhando o histórico real de execuções, este workflow
# roda a cada 2-4 HORAS, e chegou a ficar 14h sem rodar nenhuma vez. Ou seja,
# ele ajuda, mas NÃO garante serviço acordado — tratar como um bônus, nunca
# como a solução. Quem de fato resolve a espera é o dashboard: ele acorda a
# API em segundo plano assim que a landing abre (acordar_api_em_segundo_plano
# em src/dashboard/app.py) e tenta de novo enquanto ela sobe (api_client.py).
# Para keepalive confiável seria preciso um pinger externo (ex.: cron-job.org,
# gratuito e sem cartão) apontando para as duas URLs em horário comercial.

on:
  schedule:
    # 12-21 UTC = 9h-19h em America/Sao_Paulo (UTC-3), de segunda a sexta.
    - cron: "*/10 12-21 * * 1-5"
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Pingar o dashboard
        run: curl -fsS --max-time 60 -o /dev/null "${{ secrets.RENDER_DASHBOARD_URL }}"

      # O /health é o endpoint mais barato da API: não toca o YouTube nem gasta
      # cota, só confirma que o serviço está de pé.
      - name: Pingar a API
        run: curl -fsS --max-time 60 -o /dev/null "${{ secrets.RENDER_API_URL }}/health"
